name: Unlist superseded versions

# Leaves one listed version per package — the one this repo currently ships — and unlists
# the rest, so a search or a `dotnet add package` resolves to the current release rather
# than to whatever sorts highest.
#
# The keeper is read from each project's <Version>. It is deliberately NOT the highest
# published version: three ids carry Umbraco 8 builds whose numbers sort above the current
# release (Backups 8.18.7.2 over 3.3.2, CopyValue 8.18.8.1 over 2.4.0, DefaultValue
# 8.18.7.1 over 2.3.0), so keeping "the latest" would unlist the current package and keep
# the Umbraco 8 one. Backups already served 8.18.7.2 over the release that added
# authorization to its anonymous Restore and Delete endpoints; this must not repeat.
#
# Unlisting hides a version from search and from "latest" resolution without deleting it,
# so anyone pinned to an exact version keeps restoring, and it can be relisted.
#
# Manual, and dry-run unless told otherwise.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Plan only, change nothing'
        type: boolean
        default: true
      confirm:
        description: 'Type UNLIST to act (ignored when dry_run is true)'
        required: false
        default: ''
      batch_size:
        description: 'Versions per batch'
        required: false
        default: '25'
      delay_seconds:
        description: 'Pause between individual unlists'
        required: false
        default: '2'
      batch_pause_seconds:
        description: 'Pause between batches'
        required: false
        default: '30'
      start_at:
        description: 'Skip this many entries — use to resume a partial run'
        required: false
        default: '0'
      max_batches:
        description: 'Stop after this many batches (0 = all)'
        required: false
        default: '0'

# Authenticates to NuGet with NUGET_API_KEY; the repository token needs nothing else.
permissions:
  contents: read

jobs:
  unlist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build the plan
        run: |
          python3 tools/plan-unlist.py > plan.txt 2> plan-notes.txt || {
            echo "::error::Could not build the unlist plan."; exit 1; }
          echo "=== packages skipped ==="
          cat plan-notes.txt
          echo "=== versions to unlist: $(wc -l < plan.txt) ==="
          head -40 plan.txt

      - name: Refuse to unlist a shipped version
        # A bug in the planner must not cost us the current release of anything.
        run: |
          FAILED=0
          while IFS= read -r entry; do
            id="${entry%@*}"; version="${entry##*@}"
            csproj=$(find . -maxdepth 3 -name "$id.csproj" | head -1)
            [ -z "$csproj" ] && continue
            shipped=$(grep -oP '(?<=<Version>)[^<]+' "$csproj" | head -1)
            if [ "$shipped" = "$version" ]; then
              echo "::error::Plan would unlist the shipped version of $id ($version)"
              FAILED=1
            fi
          done < plan.txt
          [ "$FAILED" -eq 0 ] || exit 1
          echo "No shipped version appears in the plan."

      - name: Check confirmation
        if: ${{ inputs.dry_run == false }}
        run: |
          if [ "${{ inputs.confirm }}" != "UNLIST" ]; then
            echo "::error::Confirmation not given. Type UNLIST to proceed."
            exit 1
          fi

      - name: Unlist
        if: ${{ inputs.dry_run == false }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NUGET_API_KEY is not set."; exit 1
          fi

          BATCH_SIZE=${{ inputs.batch_size }}
          DELAY=${{ inputs.delay_seconds }}
          BATCH_PAUSE=${{ inputs.batch_pause_seconds }}
          START_AT=${{ inputs.start_at }}
          MAX_BATCHES=${{ inputs.max_batches }}

          TOTAL=$(wc -l < plan.txt)
          echo "Plan holds $TOTAL version(s); starting at offset $START_AT,"
          echo "in batches of $BATCH_SIZE with ${DELAY}s between calls and ${BATCH_PAUSE}s between batches."

          OK=0; FAILED=0; DONE=0; BATCH=0; INDEX=0
          FAILED_LIST=""

          while IFS= read -r entry; do
            INDEX=$((INDEX+1))
            # Resuming: everything before the offset was handled by an earlier run.
            [ "$INDEX" -le "$START_AT" ] && continue

            if [ $((DONE % BATCH_SIZE)) -eq 0 ]; then
              if [ "$DONE" -gt 0 ]; then
                echo "--- batch $BATCH done ($OK unlisted, $FAILED failed). Pausing ${BATCH_PAUSE}s."
                sleep "$BATCH_PAUSE"
              fi
              BATCH=$((BATCH+1))
              if [ "$MAX_BATCHES" -gt 0 ] && [ "$BATCH" -gt "$MAX_BATCHES" ]; then
                echo "Reached max_batches ($MAX_BATCHES). Resume with start_at=$((INDEX-1))."
                BATCH=$((BATCH-1))
                break
              fi
              echo "=== batch $BATCH (entries $INDEX..) ==="
            fi

            id="${entry%@*}"; version="${entry##*@}"

            # Retry with backoff. NuGet rate-limits a long run: the first attempt at this
            # left 571 unlisted and 323 "failed" after roughly 250 consecutive successes,
            # which is throttling rather than anything wrong with those packages. Output is
            # captured rather than discarded — the first run sent it to /dev/null, so the
            # reason for every one of those failures was unrecoverable.
            ATTEMPT=0; DONE_ONE=0; LAST=""
            while [ "$ATTEMPT" -lt 4 ]; do
              ATTEMPT=$((ATTEMPT+1))
              if LAST=$(dotnet nuget delete "$id" "$version" \
                   --source https://api.nuget.org/v3/index.json \
                   --api-key "$NUGET_API_KEY" --non-interactive 2>&1); then
                DONE_ONE=1; break
              fi
              # A 403 is a permission or ownership problem and will never succeed; retrying
              # it just burns the rate limit that the transient failures need.
              if printf '%s' "$LAST" | grep -qiE "forbidden|403"; then break; fi
              BACKOFF=$((ATTEMPT * ATTEMPT * 5))
              echo "  retry   $entry (attempt $ATTEMPT, waiting ${BACKOFF}s)"
              sleep "$BACKOFF"
            done

            if [ "$DONE_ONE" -eq 1 ]; then
              OK=$((OK+1))
              echo "  ok      $entry"
            else
              FAILED=$((FAILED+1)); FAILED_LIST="$FAILED_LIST $entry"
              echo "  FAILED  $entry — $(printf '%s' "$LAST" | tr '\n' ' ' | cut -c1-160)"
            fi
            DONE=$((DONE+1))
            sleep "$DELAY"
          done < plan.txt

          # Counting outcomes, not attempts. This workflow's predecessor reported
          # "Unlisted 17 version(s)" on a run where one came back 403 Forbidden.
          echo ""
          echo "=== Summary ==="
          echo "Batches run: $BATCH"
          echo "Unlisted:    $OK"
          echo "Failed:      $FAILED"
          echo "Remaining:   $((TOTAL - START_AT - DONE))"
          if [ $((TOTAL - START_AT - DONE)) -gt 0 ]; then
            echo "Resume the rest with start_at=$((START_AT + DONE))."
          fi

          if [ "$FAILED" -gt 0 ]; then
            echo "::error::Failed to unlist $FAILED version(s):$FAILED_LIST"
            echo ""
            echo "A 403 here almost always means the package is owned by a different"
            echo "nuget.org account than the one the api key was issued under. A key is"
            echo "scoped to a single package owner, and no glob widens that. Check with:"
            echo "  curl -s \"https://azuresearch-usnc.nuget.org/query?q=packageid:<id>\" | jq '.data[0].owners'"
            exit 1
          fi
