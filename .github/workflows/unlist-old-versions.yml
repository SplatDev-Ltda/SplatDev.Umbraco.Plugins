name: Unlist superseded versions

# Leaves one listed version per package — the one this repo currently ships — and unlists
# the rest, so a search or a `dotnet add package` resolves to the current release rather
# than to whatever sorts highest.
#
# The keeper is read from each project's <Version>. It is deliberately NOT the highest
# published version: three ids carry Umbraco 8 builds whose numbers sort above the current
# release (Backups 8.18.7.2 over 3.3.2, CopyValue 8.18.8.1 over 2.4.0, DefaultValue
# 8.18.7.1 over 2.3.0), so keeping "the latest" would unlist the current package and keep
# the Umbraco 8 one. Backups already served 8.18.7.2 over the release that added
# authorization to its anonymous Restore and Delete endpoints; this must not repeat.
#
# Unlisting hides a version from search and from "latest" resolution without deleting it,
# so anyone pinned to an exact version keeps restoring, and it can be relisted.
#
# Manual, and dry-run unless told otherwise.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Plan only, change nothing'
        type: boolean
        default: true
      confirm:
        description: 'Type UNLIST to act (ignored when dry_run is true)'
        required: false
        default: ''
      batch_size:
        description: 'Versions per batch'
        required: false
        default: '25'
      delay_seconds:
        description: 'Pause between individual unlists'
        required: false
        default: '2'
      batch_pause_seconds:
        description: 'Pause between batches'
        required: false
        default: '30'
      start_at:
        description: 'Skip this many entries — use to resume a partial run'
        required: false
        default: '0'
      max_batches:
        description: 'Stop after this many batches (0 = all)'
        required: false
        default: '0'
      max_entries:
        description: 'Stop after this many entries. NuGet throttles a key at roughly 240 unlists, so a larger run cannot finish (0 = no cap)'
        required: false
        default: '200'
      abort_after_consecutive_failures:
        description: 'Stop the run once this many entries fail in a row — past that point the key is throttled and the rest will fail too (0 = never)'
        required: false
        default: '8'

# Authenticates to NuGet with NUGET_API_KEY; the repository token needs nothing else.
permissions:
  contents: read

jobs:
  unlist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build the plan
        run: |
          python3 tools/plan-unlist.py > plan.txt 2> plan-notes.txt || {
            echo "::error::Could not build the unlist plan."; exit 1; }
          echo "=== packages skipped ==="
          cat plan-notes.txt
          echo "=== versions to unlist: $(wc -l < plan.txt) ==="
          head -40 plan.txt

      - name: Refuse to unlist a shipped version
        # A bug in the planner must not cost us the current release of anything.
        run: |
          FAILED=0
          while IFS= read -r entry; do
            id="${entry%@*}"; version="${entry##*@}"
            csproj=$(find . -maxdepth 3 -name "$id.csproj" | head -1)
            [ -z "$csproj" ] && continue
            shipped=$(grep -oP '(?<=<Version>)[^<]+' "$csproj" | head -1)
            if [ "$shipped" = "$version" ]; then
              echo "::error::Plan would unlist the shipped version of $id ($version)"
              FAILED=1
            fi
          done < plan.txt
          [ "$FAILED" -eq 0 ] || exit 1
          echo "No shipped version appears in the plan."

      - name: Check confirmation
        if: ${{ inputs.dry_run == false }}
        run: |
          if [ "${{ inputs.confirm }}" != "UNLIST" ]; then
            echo "::error::Confirmation not given. Type UNLIST to proceed."
            exit 1
          fi

      - name: Unlist
        if: ${{ inputs.dry_run == false }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NUGET_API_KEY is not set."; exit 1
          fi

          BATCH_SIZE=${{ inputs.batch_size }}
          DELAY=${{ inputs.delay_seconds }}
          BATCH_PAUSE=${{ inputs.batch_pause_seconds }}
          START_AT=${{ inputs.start_at }}
          MAX_BATCHES=${{ inputs.max_batches }}
          MAX_ENTRIES=${{ inputs.max_entries }}
          ABORT_STREAK=${{ inputs.abort_after_consecutive_failures }}

          # Ids that have unlisted at least once in this run, so a later 403 on one of them
          # is throttling rather than the key not owning the package.
          PROVEN_OWNED=$(mktemp)

          TOTAL=$(wc -l < plan.txt)
          echo "Plan holds $TOTAL version(s); starting at offset $START_AT,"
          echo "in batches of $BATCH_SIZE with ${DELAY}s between calls and ${BATCH_PAUSE}s between batches."

          OK=0; FAILED=0; DONE=0; BATCH=0; INDEX=0
          STREAK=0; ABORTED=0
          FAILED_LIST=""

          while IFS= read -r entry; do
            INDEX=$((INDEX+1))
            # Resuming: everything before the offset was handled by an earlier run.
            [ "$INDEX" -le "$START_AT" ] && continue

            if [ $((DONE % BATCH_SIZE)) -eq 0 ]; then
              if [ "$DONE" -gt 0 ]; then
                echo "--- batch $BATCH done ($OK unlisted, $FAILED failed). Pausing ${BATCH_PAUSE}s."
                sleep "$BATCH_PAUSE"
              fi
              BATCH=$((BATCH+1))
              if [ "$MAX_BATCHES" -gt 0 ] && [ "$BATCH" -gt "$MAX_BATCHES" ]; then
                echo "Reached max_batches ($MAX_BATCHES). Resume with start_at=$((INDEX-1))."
                BATCH=$((BATCH-1))
                break
              fi
              echo "=== batch $BATCH (entries $INDEX..) ==="
            fi

            id="${entry%@*}"; version="${entry##*@}"

            # Retry with backoff.
            #
            # A 403 used to break out immediately, on the reasoning that it means the
            # package is owned by another account and will never succeed. That is true of
            # an ownership 403 and false of a throttling one, and NuGet returns 403 for
            # both. Run 2 unlisted 240 entries without a single failure and then failed
            # 130 in a row; exactly one retry fired in the whole run, because every one of
            # those failures took the 403 break. The retry existed and could not run.
            #
            # An id that has already unlisted successfully in this run is proven to be
            # owned by this key, so a later 403 on it is throttling and is retried. An id
            # that has never succeeded keeps the old behaviour, because for that one the
            # ownership reading is still live.
            ATTEMPT=0; DONE_ONE=0; LAST=""
            while [ "$ATTEMPT" -lt 4 ]; do
              ATTEMPT=$((ATTEMPT+1))
              if LAST=$(dotnet nuget delete "$id" "$version" \
                   --source https://api.nuget.org/v3/index.json \
                   --api-key "$NUGET_API_KEY" --non-interactive 2>&1); then
                DONE_ONE=1; break
              fi
              if printf '%s' "$LAST" | grep -qiE "forbidden|403"; then
                if ! grep -qxF "$id" "$PROVEN_OWNED"; then
                  echo "  403     $entry — no version of this id has unlisted in this run; treating as ownership, not retrying"
                  break
                fi
                echo "  403     $entry — this id has unlisted before in this run, so this is throttling; retrying"
              fi
              BACKOFF=$((ATTEMPT * ATTEMPT * 5))
              echo "  retry   $entry (attempt $ATTEMPT, waiting ${BACKOFF}s)"
              sleep "$BACKOFF"
            done

            if [ "$DONE_ONE" -eq 1 ]; then
              OK=$((OK+1)); STREAK=0
              grep -qxF "$id" "$PROVEN_OWNED" || echo "$id" >> "$PROVEN_OWNED"
              echo "  ok      $entry"
            else
              FAILED=$((FAILED+1)); STREAK=$((STREAK+1)); FAILED_LIST="$FAILED_LIST $entry"
              # dotnet nuget delete opens with a warn : line naming the package and the
              # endpoint, which is 120-odd characters of nothing before the status code.
              # Truncating from the front threw the reason away on every failure of run 2.
              REASON=$(printf '%s' "$LAST" \
                | grep -iE "error|forbidden|unauthorized|too many|throttl|timed out|[0-9]{3} \(" \
                | tr '\n' ' ' | sed -E 's/[[:space:]]+/ /g' | cut -c1-300)
              [ -n "$REASON" ] || REASON=$(printf '%s' "$LAST" | tr '\n' ' ' | sed -E 's/[[:space:]]+/ /g' | tail -c 300)
              echo "  FAILED  $entry — $REASON"
            fi
            DONE=$((DONE+1))

            # Once the key is throttled every remaining call fails, so a long run turns
            # into a long list of failures that says nothing. Run 2 recorded 130 of them.
            # Stop instead, and report where to resume.
            if [ "$ABORT_STREAK" -gt 0 ] && [ "$STREAK" -ge "$ABORT_STREAK" ]; then
              echo ""
              echo "$STREAK entries failed in a row — stopping rather than working through the rest."
              echo "This is what a throttled key looks like: it is not specific to these packages."
              ABORTED=1
              break
            fi

            if [ "$MAX_ENTRIES" -gt 0 ] && [ "$DONE" -ge "$MAX_ENTRIES" ]; then
              echo ""
              echo "Reached max_entries ($MAX_ENTRIES)."
              break
            fi

            sleep "$DELAY"
          done < plan.txt

          # Counting outcomes, not attempts. This workflow's predecessor reported
          # "Unlisted 17 version(s)" on a run where one came back 403 Forbidden.
          echo ""
          echo "=== Summary ==="
          echo "Batches run: $BATCH"
          echo "Unlisted:    $OK"
          echo "Failed:      $FAILED"
          echo "Remaining:   $((TOTAL - START_AT - DONE))"
          if [ $((TOTAL - START_AT - DONE)) -gt 0 ]; then
            echo "Resume the rest with start_at=$((START_AT + DONE))."
          fi

          if [ "$ABORTED" -eq 1 ]; then
            echo ""
            echo "::error::Stopped after $STREAK consecutive failures. Unlisted $OK before that."
            echo "Resume with start_at=$((START_AT + DONE)) once the rate limit has reset."
            echo "Observed ceiling is roughly 240 unlists per key per run, so keep max_entries under it."
            exit 1
          fi

          if [ "$FAILED" -gt 0 ]; then
            echo "::error::Failed to unlist $FAILED version(s):$FAILED_LIST"
            echo ""
            echo "Two different things return 403 here and they need different responses."
            echo ""
            echo "Throttling: a long run stops succeeding partway through and everything"
            echo "after fails. Run 2 unlisted 240 without a failure and then failed 130 in"
            echo "a row. Wait, then resume with start_at=$((START_AT + DONE))."
            echo ""
            echo "Ownership: a key is scoped to one nuget.org package owner, and no glob"
            echo "widens that. Failures from the very first attempt, on ids that never"
            echo "succeed, are this. Check with:"
            echo "  curl -s \"https://azuresearch-usnc.nuget.org/query?q=packageid:<id>\" | jq '.data[0].owners'"
            exit 1
          fi
