name: Deploy staging

# Manual only. Staging is outward-facing, so a deploy is a decision someone makes rather
# than something a merge triggers.
#
# The instance is a Docker container whose application is baked into the image - the only
# volumes are u17_media and u17_plugins, and neither carries the app. So a deploy is not a
# file copy: it packs every plugin, ships the build context, and rebuilds the image on the
# host. An earlier version of this workflow rsynced published output to a host directory,
# which the container would never have read.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to deploy"
        required: false
        default: master
      dry_run:
        description: "Pack and report what would ship, but change nothing on the host"
        required: false
        default: false
        type: boolean
      no_cache:
        description: "Rebuild the image from scratch (slower; use after a base-image or template change)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 1
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  SERVICE: u17-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    # packages: read is required, not optional. nuget.config maps PdfCurator.* to the
    # private github-splatdevtech feed and resolves its credentials from GITHUB_TOKEN, so
    # without this the restore answers 403 Forbidden and the whole deploy stops before it
    # packs anything. build.yml has always had it; this workflow did not.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # Fail here rather than three steps later inside an ssh error nobody can read. A step
      # that reports success having done nothing is the failure mode this repo has now
      # found four separate times.
      - name: Check the deploy secrets exist
        run: |
          missing=0
          for name in STAGING_SSH_HOST STAGING_SSH_USER STAGING_SSH_PASSWORD STAGING_SRC; do
            if [ -z "${!name}" ]; then echo "::error::secret $name is not set"; missing=1; fi
          done
          [ "$missing" = "0" ] || exit 1
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
          STAGING_SRC: ${{ secrets.STAGING_SRC }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore SplatDev.Core.sln

      # Discovery matches publish.yml's, so a package that ships is a package staging gets.
      # dotnet pack succeeds and emits nothing for IsPackable=false, so the artifact is
      # counted rather than the exit status.
      - name: Pack the plugins
        run: |
          mkdir -p ctx/local-packages
          packed=0; failed=0
          for csproj in $(find . -maxdepth 3 -name "SplatDev.*.csproj" \
            | grep -v "Tests\|BackupManager\|FormsClone\|obj\|bin\|PdfCurator\|/customers/\|test-environments" \
            | sort); do
            if dotnet build "$csproj" -c Release --no-restore 2>&1 | grep -q "Build succeeded"; then
              dotnet pack "$csproj" --no-build -c Release -o ctx/local-packages >/dev/null 2>&1 || true
              packed=$((packed+1))
            else
              echo "::warning::build failed, not packed: $csproj"; failed=$((failed+1))
            fi
          done
          count=$(ls ctx/local-packages/*.nupkg 2>/dev/null | wc -l)
          echo "built $packed project(s), $failed failed, $count package(s) on disk"
          if [ "$count" = "0" ]; then echo "::error::nothing packed"; exit 1; fi
          if [ "$failed" != "0" ]; then echo "::error::$failed project(s) failed to build"; exit 1; fi

      # --packages-dir makes this fail when a plugin the props file lists has no .nupkg,
      # rather than letting the instance quietly test fewer plugins than it claims to.
      - name: Generate plugins.props
        run: |
          python3 tools/make-plugins-props.py --out ctx/plugins.props --packages-dir ctx/local-packages
          echo "referencing $(grep -c PackageReference ctx/plugins.props) package(s)"

      - name: Assemble the build context
        run: |
          cp infra/testing-instances/u17/Dockerfile ctx/Dockerfile
          cp infra/testing-instances/docker-compose.yml ctx/docker-compose.yml
          du -sh ctx | sed 's/^/context: /'

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync

      - name: Trust the host key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H "${{ secrets.STAGING_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # sshpass -e reads SSHPASS from the environment; passing it on the command line would
      # expose it in the host's process list.
      - name: Ship the build context
        if: ${{ !inputs.dry_run }}
        env:
          SSHPASS: ${{ secrets.STAGING_SSH_PASSWORD }}
        run: |
          rsync -az --delete -e "sshpass -e ssh -o StrictHostKeyChecking=yes" \
            ctx/ "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}:${{ secrets.STAGING_SRC }}/"

      - name: Report what would ship
        if: ${{ inputs.dry_run }}
        run: |
          echo "would ship $(ls ctx/local-packages/*.nupkg | wc -l) package(s) to ${{ secrets.STAGING_SRC }}"
          ls ctx/local-packages | head -20

      # The image carries the app, so rebuilding it is the deploy. It also clears any
      # physical App_Plugins baked in by an older content-copying release, which is what
      # made staging log fifteen "Extension with alias X is already registered" errors.
      - name: Rebuild and restart
        if: ${{ !inputs.dry_run }}
        env:
          SSHPASS: ${{ secrets.STAGING_SSH_PASSWORD }}
        run: |
          cache=""; [ "${{ inputs.no_cache }}" = "true" ] && cache="--no-cache"
          dir="${{ secrets.STAGING_COMPOSE_DIR || secrets.STAGING_SRC }}"
          sshpass -e ssh -o StrictHostKeyChecking=yes \
            "${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}" \
            "set -e; cd '$dir'; docker compose build $cache $SERVICE; \
             docker compose up -d --force-recreate $SERVICE"

      # Umbraco takes a while to come up with this many plugins, and a deploy that leaves
      # the site down has to fail the job rather than end green.
      - name: Wait for the site to answer
        if: ${{ !inputs.dry_run }}
        run: |
          url="${{ vars.STAGING_URL || 'https://staging-umbraco.splatdev.tech' }}/umbraco"
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url" || true)
            if [ "$code" = "200" ]; then echo "up after ~$((i*10))s"; exit 0; fi
            echo "  $((i*10))s: $code"
            sleep 10
          done
          echo "::error::site did not return 200 within 400s"
          exit 1

      # Proves the duplicate-alias fix actually landed, rather than assuming it did.
      - name: Report the extension manifest
        if: ${{ !inputs.dry_run }}
        run: |
          url="${{ vars.STAGING_URL || 'https://staging-umbraco.splatdev.tech' }}"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            "$url/umbraco/management/api/v1/manifest/manifest/private" || true)
          echo "manifest endpoint answered $code (401 is expected unauthenticated; 404 is not)"
          [ "$code" = "404" ] && { echo "::error::manifest endpoint missing"; exit 1; } || true
