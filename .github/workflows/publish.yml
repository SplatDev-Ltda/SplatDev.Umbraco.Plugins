name: Publish NuGet Packages

on:
  push:
    tags:
      - 'v*'

env:
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 1

jobs:
  publish:
    runs-on: ubuntu-latest
    # Pushing to GitHub Packages needs packages:write. Without this block the job gets
    # the repository's default token permissions, which are read-only, and every push
    # answers 403.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        # The solution restore covers every member project (D4Sign, ENotAssina,
        # Schema2Yaml, Yaml2Schema included), so the per-csproj restores that used
        # to follow were redundant.
        run: dotnet restore SplatDev.Core.sln

      - name: Build & Pack publishable plugins
        run: |
          mkdir -p ./nupkgs
          FAIL=()
          PASS=()
          NOOUT=()
          # Every packable SplatDev project, not a hand-maintained list of name patterns.
          #
          # The list this replaces named five patterns, so roughly fifty packages —
          # SplatDev.Umbraco.DataTypes.*, SplatDev.Messaging.*, SplatDev.Search.*,
          # SplatDev.Logger, SplatDev.Security and the rest — were never discovered here
          # at all. They are on NuGet from manual pushes and frozen there: no tag could
          # refresh them, so nothing added to their READMEs could ever reach a package
          # page. SplatDev.Umbraco.DataTypes.USStates 2.0.1 still shows "missing a
          # README" for exactly that reason, having been packed before the README wiring
          # existed and never republished since.
          #
          # Discovering by prefix rather than by list means a new package ships by
          # existing. Projects with IsPackable=false emit nothing and are reported below
          # as such, so nothing needs to be excluded by name for that.
          for csproj in $(find . -maxdepth 3 -name "SplatDev.*.csproj" \
            | grep -v "Tests\|BackupManager\|FormsClone\|obj\|bin\|PdfCurator\|/customers/\|test-environments" \
            | sort); do
            name=$(basename "$csproj" .csproj)
            echo "--- Building $name ---"
            if dotnet build "$csproj" -c Release --no-restore 2>&1 | grep -q "Build succeeded"; then
              dotnet pack "$csproj" --no-build -c Release -o ./nupkgs
              # Count the artifact, not the exit status. dotnet pack succeeds and emits
              # nothing for a project with IsPackable=false, so a project could be listed
              # as "Packed" having produced no package — ContentPackages was reported that
              # way in v2.1.7, and the same shape is how Schema2Yaml went unnoticed.
              if compgen -G "./nupkgs/${name}.*.nupkg" > /dev/null; then
                PASS+=("$name")
              else
                echo "::notice::$name built but produced no package (IsPackable=false?)"
                NOOUT+=("$name")
              fi
            else
              echo "::warning::Skipping $name (build failed)"
              FAIL+=("$name")
            fi
          done
          echo ""
          echo "=== Pack Summary ==="
          echo "Packed (${#PASS[@]}): ${PASS[*]}"
          if [ ${#NOOUT[@]} -gt 0 ]; then
            echo "Built but produced no package (${#NOOUT[@]}): ${NOOUT[*]}"
          fi
          if [ ${#FAIL[@]} -gt 0 ]; then
            echo "Skipped (${#FAIL[@]}): ${FAIL[*]}"
          fi

      - name: List packages
        run: ls -la ./nupkgs/*.nupkg 2>/dev/null || echo "No packages generated"

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          PUSHED=()
          SKIPPED=()
          FAILED=()
          for pkg in ./nupkgs/*.nupkg; do
            filename=$(basename "$pkg" .nupkg)
            # PackageId ends at the first dot-then-digit boundary; version is the rest
            pkgid=$(echo "$filename" | sed -E 's/\.[0-9].*//')
            pkgver="${filename#${pkgid}.}"
            pkgid_lower=$(echo "$pkgid" | tr '[:upper:]' '[:lower:]')
            # Check if version already exists on NuGet.org (avoid 409 rate-limit hits)
            nuget_url="https://api.nuget.org/v3-flatcontainer/${pkgid_lower}/index.json"
            existing=$(curl -sf "$nuget_url" 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print('yes' if '${pkgver}' in d.get('versions',[]) else 'no')" 2>/dev/null || echo "no")
            if [ "$existing" = "yes" ]; then
              echo "Skipping $filename (already on NuGet.org)"
              SKIPPED+=("$filename")
              continue
            fi
            echo "Pushing $filename..."
            for attempt in 1 2 3; do
              if dotnet nuget push "$pkg" \
                  --api-key "$NUGET_API_KEY" \
                  --source https://api.nuget.org/v3/index.json \
                  --skip-duplicate \
                  --no-symbols; then
                PUSHED+=("$filename")
                break
              elif [ $attempt -lt 3 ]; then
                echo "::warning::Push attempt $attempt failed for $filename, retrying in 10s..."
                sleep 10
              else
                echo "::error::Push failed for $filename after 3 attempts"
                FAILED+=("$filename")
              fi
            done
          done
          echo ""
          echo "=== NuGet Push Summary ==="
          echo "Pushed  (${#PUSHED[@]}): ${PUSHED[*]:-none}"
          echo "Skipped (${#SKIPPED[@]}): ${SKIPPED[*]:-none}"
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "Failed  (${#FAILED[@]}): ${FAILED[*]}"
            exit 1
          fi

      - name: Push to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The feed owner has to be the owner of this repository: GITHUB_TOKEN is scoped
          # to it and nothing else. This was hardcoded to SplatDev-Ltda while the repo
          # lives under splatdevtech, so every push answered 403 for v2.7.0 and every
          # release before it.
          OWNER="${{ github.repository_owner }}"
          FEED="https://nuget.pkg.github.com/$OWNER/index.json"
          echo "Pushing to $FEED"

          PUSHED=(); FAILED=()
          for pkg in ./nupkgs/*.nupkg; do
            filename=$(basename "$pkg")
            if dotnet nuget push "$pkg" \
                 --api-key "$GITHUB_TOKEN" \
                 --source "$FEED" \
                 --skip-duplicate \
                 --no-symbols; then
              PUSHED+=("$filename")
            else
              FAILED+=("$filename")
            fi
          done

          # Counting outcomes rather than attempts. This step used to swallow every
          # failure into a ::warning:: and let the job report success, so the entire
          # GitHub Packages half of the release did nothing and nobody could tell.
          echo "=== GitHub Packages Summary ==="
          echo "Pushed (${#PUSHED[@]})"
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "::error::GitHub Packages push failed for ${#FAILED[@]} package(s): ${FAILED[*]}"
            exit 1
          fi
